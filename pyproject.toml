[project]
name = "editor-de-video"
version = "0.1.0"
description = "Edita vídeos falados no estilo dos Shorts — legenda karaokê, cortes de silêncio, zoom, adesivos, ícones e thumbnail — no seu computador."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licencas/*"]
authors = [{ name = "lucasteles1231" }]
keywords = ["legendas", "whisper", "edicao-de-video", "shorts", "reels", "tiktok"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "faster-whisper>=1.1",
    "av>=14",
    "pillow>=11",
    "numpy>=2",
    "rough==1.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "platformdirs>=4",
    # Já vêm com o faster-whisper; declarados porque o editor usa direto: o recorte da
    # pessoa (onnxruntime + o modelo do Hugging Face) e a conversa com o Gemini (httpx).
    "onnxruntime>=1.17",
    "huggingface-hub>=0.23",
    "httpx>=0.27",
]

[project.urls]
Repositorio = "https://github.com/lucasteles1231/editor-de-video"

[project.scripts]
editar = "editor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-playwright>=0.5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Acentos e travessões são português, não caracteres ambíguos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A raiz no caminho: no macOS, pastas sincronizadas com o iCloud marcam o .pth da
# instalação editável como oculto, e o Python 3.12+ ignora .pth oculto.
pythonpath = ["."]
markers = ["navegador: testes que abrem a página num navegador de verdade (Playwright)"]
